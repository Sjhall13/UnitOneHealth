<form action="https://formspree.io/f/maeypvvq" method="POST">
  <h2>Referral Form</h2>

  <label>Your Name (Person Completing Form)</label>
  <input type="text" name="referrer_name" required>

  <label>Office Phone Number</label>
  <input type="tel" name="office_phone" required>

  <label>Office Email</label>
  <input type="email" name="office_email" required>

  <label>Facility Name</label>
  <input type="text" name="facility_name" required>

  <label>Patient Initials Only</label>
  <input type="text" name="patient_initials" required>

  <label>Patient ZIP Code</label>
  <input type="text" name="patient_zip" required>

  <label>Reason for Referral (general, non-clinical)</label>
  <textarea name="reason" rows="4" required></textarea>

  <button type="submit">Submit Referral</button>
</form>

<div id="confirmation" style="display:none; margin-top:20px;">
  <p><strong>Thank you.</strong> A Unit One Health Case Manager will contact you within 1 hour to obtain patient information.</p>
</div>

<script>
  // Simple client-side confirmation message
  const form = document.querySelector('form');
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    document.getElementById('confirmation').style.display = 'block';
    form.style.display = 'none';

    // Actually submit the form to Formspree
    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    });
  });
</script>

<p><small>
This referral form collects no PHI. A Unit One Health Case Manager will follow up to obtain patient information securely.
</small></p>
